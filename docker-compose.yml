version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: verisure_db
    environment:
      POSTGRES_USER: verisure_user
      POSTGRES_PASSWORD: verisure_pass
      POSTGRES_DB: verisure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verisure_user -d verisure_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
